syntax = "proto2";

package mixxx.track.io;

option optimize_for = LITE_RUNTIME;

enum Source {
  ANALYZER = 0;
  FILE_METADATA = 1;
  USER = 2;
}

message Beat {
  optional int32 frame_position = 1;
  optional bool enabled = 2 [ default = true ];
  optional Source source = 3 [ default = ANALYZER ];
}

message Bpm {
  optional double bpm = 1;
  optional Source source = 2 [ default = ANALYZER ];
}

// downbeats_offset is the grid index of the first downbeat, counted from the
// anchor beat. An absent field means that the bar phase is unknown.
//
// BeatGrid.downbeats_offset takes the number of upstream pull request 14835,
// thus the fork reads what that work writes. The other three fields are of
// this fork alone, and they start at 100, where no upstream field can meet
// them.
message BeatMap {
  repeated Beat beat = 1;
  optional int32 downbeats_offset = 100;
  optional int32 beats_per_bar = 101;
}

message BeatGrid {
  optional Bpm bpm = 1;
  optional Beat first_beat = 2;
  optional int32 downbeats_offset = 3;
  optional int32 beats_per_bar = 100;
}
